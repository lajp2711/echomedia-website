  <path d="M450 210 C345 55 120 55 120 210 C120 365 345 365 450 210 C555 55 780 55 780 210 C780 365 555 365 450 210Z" fill="none" stroke="url(#line)" stroke-width="42" stroke-linecap="round" opacity=".28" filter="url(#glow)"/>
